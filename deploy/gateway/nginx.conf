events {}

http {
  # Services run as containers in the compose network (air hot-reload in dev).
  # Runtime DNS: nginx boots even before service containers exist.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;

    location = /healthz {
      return 200 "ok\n";
    }

    # Strip the /api/<service>/ prefix before proxying
    location /api/orders/ {
      rewrite ^/api/orders/(.*)$ /$1 break;
      set $upstream http://order:8080;
      proxy_pass $upstream;
    }
    location /api/inventory/ {
      rewrite ^/api/inventory/(.*)$ /$1 break;
      set $upstream http://inventory:8080;
      proxy_pass $upstream;
    }
    location /api/payments/ {
      rewrite ^/api/payments/(.*)$ /$1 break;
      set $upstream http://payment:8080;
      proxy_pass $upstream;
    }
  }
}
