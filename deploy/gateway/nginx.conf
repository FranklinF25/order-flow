events {}

http {
  # Services run as containers in the compose network (air hot-reload in dev).
  # Runtime DNS: nginx boots even before service containers exist.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;

    location = /healthz {
      return 200 "ok\n";
    }

    # Map /api/<service>/* → /<service>/* on each upstream.
    # NOTE: `set` must come BEFORE `rewrite ... break` — `break` stops the rewrite
    # module, and `set` belongs to it (empty var => "invalid URL prefix").
    location /api/orders {
      set $upstream http://order:8080;
      rewrite ^/api/orders(.*)$ /orders$1 break;
      proxy_pass $upstream;
    }
    location /api/inventory {
      set $upstream http://inventory:8080;
      rewrite ^/api/inventory(.*)$ /inventory$1 break;
      proxy_pass $upstream;
    }
    location /api/payments {
      set $upstream http://payment:8080;
      rewrite ^/api/payments(.*)$ /payments$1 break;
      proxy_pass $upstream;
    }
  }
}
